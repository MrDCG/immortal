<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云上香</title>
    <!-- Umami Analytics - 隐私友好的网站流量统计 -->
    <script>
      // 从环境变量读取配置，在构建时会被替换
      var umamiEnabled = '%VITE_UMAMI_ENABLED%' === 'true';
      var umamiScriptUrl = '%VITE_UMAMI_SCRIPT_URL%';
      var umamiWebsiteId = '%VITE_UMAMI_WEBSITE_ID%';

      if (umamiEnabled && umamiScriptUrl && umamiWebsiteId && umamiWebsiteId !== 'your-website-id') {
        var script = document.createElement('script');
        script.async = true;
        script.src = umamiScriptUrl;
        script.dataset.websiteId = umamiWebsiteId;
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
